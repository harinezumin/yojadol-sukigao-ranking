<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>ヨジャドル好き顔メーカー ♡</title>

  <link rel="stylesheet" href="style.css">
</head>


<body>

  <main class="app">


    <!-- =========================
         START画面
    ========================== -->

    <section
      id="start-screen"
      class="screen active"
    >

      <div class="logo">♡</div>

      <h1>
        ヨジャドル<br>
        好き顔メーカー
      </h1>

      <p class="subtitle">
        あなたの「好き♡」を<br>
        顔だけで選んでみよう
      </p>

      <div class="info-box">

        <p>♡ 女性K-POPアイドル</p>
        <p>♡ 2人ずつ比較</p>
        <p>♡ トーナメント方式→総当たり戦</p>
        <p>♡ 最後にランキング発表</p>

      </div>

      <button
        id="start-button"
        class="main-button"
      >
        START ♡
      </button>

    </section>



    <!-- =========================
         対戦画面
    ========================== -->

    <section
      id="match-screen"
      class="screen"
    >

      <div class="progress-area">

        <span id="round-text">
          ROUND 1
        </span>

        <span id="match-text">
          1 / 1
        </span>

      </div>


      <h2>
        どっちの顔が好き？
      </h2>


      <div class="cards">


        <!-- 左 -->

        <button
          id="card-left"
          class="idol-card"
          type="button"
        >

          <img
            id="image-left"
            src=""
            alt=""
          >

          <div class="idol-info">

            <strong id="name-left">
            </strong>

            <span id="group-left">
            </span>

          </div>

        </button>


        <div class="vs">
          VS
        </div>


        <!-- 右 -->

        <button
          id="card-right"
          class="idol-card"
          type="button"
        >

          <img
            id="image-right"
            src=""
            alt=""
          >

          <div class="idol-info">

            <strong id="name-right">
            </strong>

            <span id="group-right">
            </span>

          </div>

        </button>


      </div>

    </section>



    <!-- =========================
         結果画面
    ========================== -->

    <section
      id="result-screen"
      class="screen"
    >

      <p class="result-small">
        YOUR
      </p>

      <h1 class="result-title">
        RANKING
      </h1>


      <div
        id="top9-grid"
        class="top9-grid"
      >
      </div>


      <p class="result-message">
        My favorite faces ♡
      </p>


      <button
        id="retry-button"
        class="main-button"
        type="button"
      >
        もう一度遊ぶ
      </button>

    </section>


  </main>


  <script src="script.js"></script>

</body>

</html>
